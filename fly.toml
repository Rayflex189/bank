# fly.toml app configuration file generated for horizon-trust-bank on 2026-05-09T20:53:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'horizon-trust-bank'
primary_region = 'cdg'

[build]

[deploy]
  release_command = "    python manage.py migrate --no-input && python -c \"from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(username='MrDarius').exists() or User.objects.create_superuser('MrDarius', 'admin@example.com', 'me12sleep')\"\n  "

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
