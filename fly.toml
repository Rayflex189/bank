# fly.toml app configuration file generated for horizon-trust-bank on 2026-05-09T13:40:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'horizon-trust-bank'
primary_region = 'cdg'

[build]

[deploy]
  release_command = "python manage.py migrate --no-input"

[http_service]
  internal_port = 8088
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
